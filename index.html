<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多益衝400分核心必備單字闖關卡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              pinkLight: '#FFF0F5',
              pinkSoft: '#FCE7F3',
              pinkAccent: '#F472B6',
              pinkDark: '#DB2777',
              yellowLight: '#FFFBEB',
              yellowSoft: '#FEF3C7',
              yellowAccent: '#FBBF24',
              yellowDark: '#D97706',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, sans-serif;
      user-select: none;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #FBCFE8;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-[#FFFDFB] text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- 頂部資訊列 -->
  <header class="bg-white/90 backdrop-blur-md border-b border-rose-100 sticky top-0 z-30 shadow-xs">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-pink-400 to-amber-300 flex items-center justify-center text-white font-bold shadow-md shadow-pink-100">
          <i class="fa-solid fa-seedling text-lg"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-base sm:text-lg text-slate-800 leading-tight">多益衝400分單字卡</h1>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span id="sync-status-badge" class="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-600 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-full">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>自動同步儲存中</span>
            </span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- 檔案備份與還原快捷選單 -->
        <button onclick="exportDataBackup()" class="px-2.5 py-1.5 rounded-xl border border-rose-200 bg-white hover:bg-rose-50 text-slate-700 text-xs font-semibold flex items-center gap-1 transition-all" title="下載備份檔">
          <i class="fa-solid fa-download text-pink-500"></i>
          <span class="hidden sm:inline">下載存檔</span>
        </button>
        <label class="px-2.5 py-1.5 rounded-xl border border-rose-200 bg-white hover:bg-rose-50 text-slate-700 text-xs font-semibold flex items-center gap-1 cursor-pointer transition-all" title="讀取備份檔">
          <i class="fa-solid fa-upload text-amber-500"></i>
          <span class="hidden sm:inline">匯入存檔</span>
          <input type="file" id="import-file-input" accept=".json" class="hidden" onchange="importDataBackup(event)">
        </label>

        <!-- 星號收藏過濾按鈕 -->
        <button id="btn-star-filter" onclick="toggleStarredView()" class="relative px-3 sm:px-4 py-1.5 rounded-xl border border-amber-300 bg-amber-50 hover:bg-amber-100 text-amber-900 text-xs sm:text-sm font-bold flex items-center gap-1.5 transition-all">
          <i class="fa-solid fa-star text-amber-400 text-sm"></i>
          <span>星號錯題</span>
          <span id="starred-badge" class="ml-0.5 bg-amber-400 text-white text-[11px] px-1.5 py-0.2 rounded-full font-black shadow-xs">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-4xl mx-auto px-4 py-5 w-full flex-1 flex flex-col">

    <!-- 單元選擇區 (Part 1 ~ Part 10) -->
    <div id="part-selector-container" class="mb-5 bg-white p-4 rounded-3xl shadow-sm border border-rose-100/80">
      <div class="flex items-center justify-between mb-2.5">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
          <i class="fa-solid fa-layer-group text-pink-400"></i> 單元清單 (每單元 25 字零重複)
        </span>
        <span id="current-part-label" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-pink-100 text-pink-700">Part 1</span>
      </div>
      <div class="flex flex-wrap gap-2" id="part-buttons">
        <!-- JS 動態生成 10 個 Part 按鈕 -->
      </div>
    </div>

    <!-- 模式選擇籤 -->
    <div class="flex gap-2 mb-5">
      <button onclick="setMode('flashcard')" id="tab-flashcard" class="tab-btn px-4 py-2 font-bold text-xs sm:text-sm rounded-2xl transition-all bg-gradient-to-r from-pink-500 to-rose-400 text-white shadow-md shadow-pink-200">
        <i class="fa-solid fa-clone mr-1"></i> 翻轉卡片
      </button>
      <button onclick="setMode('quiz')" id="tab-quiz" class="tab-btn px-4 py-2 font-bold text-xs sm:text-sm rounded-2xl transition-all bg-white text-slate-600 hover:bg-rose-50 border border-slate-200/80">
        <i class="fa-solid fa-bolt mr-1 text-amber-500"></i> 4選1挑戰
      </button>
      <button onclick="setMode('list')" id="tab-list" class="tab-btn px-4 py-2 font-bold text-xs sm:text-sm rounded-2xl transition-all bg-white text-slate-600 hover:bg-rose-50 border border-slate-200/80">
        <i class="fa-solid fa-list-check mr-1 text-pink-400"></i> 單字總覽
      </button>
    </div>

    <!-- ================= 模式 1：翻轉卡片 ================= -->
    <section id="mode-flashcard" class="flex-1 flex flex-col items-center justify-center">
      <!-- 控制頂部列 -->
      <div class="w-full max-w-lg flex items-center justify-between text-xs sm:text-sm text-slate-500 mb-2.5 px-2">
        <span id="card-counter" class="font-bold text-slate-700">1 / 25</span>
        <div class="flex items-center gap-2">
          <button onclick="shuffleCurrentList()" class="hover:text-pink-600 text-xs px-2.5 py-1 rounded-xl border border-rose-200 bg-white hover:bg-rose-50 transition-all font-medium" title="打亂當前卡片">
            <i class="fa-solid fa-shuffle mr-1 text-pink-400"></i>隨機洗牌
          </button>
          <button onclick="toggleAudioAuto()" id="btn-auto-audio" class="hover:text-pink-600 text-xs px-2.5 py-1 rounded-xl border border-rose-200 bg-white hover:bg-rose-50 transition-all font-medium" title="翻牌時自動發音">
            <i class="fa-solid fa-volume-high mr-1 text-amber-500"></i>自動發音: <span id="auto-audio-status" class="font-bold text-pink-600">開</span>
          </button>
        </div>
      </div>

      <!-- 3D 翻轉卡片主體 -->
      <div class="w-full max-w-lg h-96 perspective-1000 cursor-pointer" onclick="flipCard()">
        <div id="flashcard-inner" class="w-full h-full relative transform-style-3d transition-transform duration-500 rounded-3xl shadow-xl border border-rose-100 bg-white">
          
          <!-- 卡片正面 (英文單字) -->
          <div class="absolute inset-0 w-full h-full backface-hidden p-8 flex flex-col justify-between rounded-3xl bg-gradient-to-b from-white via-white to-pink-50/40 border border-rose-100">
            <div class="flex items-center justify-between">
              <span id="card-pos-front" class="px-3 py-1 rounded-full bg-pink-100 text-pink-700 text-xs font-extrabold uppercase tracking-wider">noun</span>
              <!-- 星號按鈕 -->
              <button onclick="event.stopPropagation(); toggleCurrentCardStar();" class="p-2 -mr-2 text-3xl transition-transform active:scale-125 focus:outline-none" title="加入/取消收藏">
                <i id="card-star-icon" class="fa-regular fa-star text-slate-300 hover:text-amber-400"></i>
              </button>
            </div>

            <div class="text-center my-auto">
              <h2 id="card-word" class="text-4xl sm:text-5xl font-black text-slate-800 tracking-tight">company</h2>
              <button onclick="event.stopPropagation(); playCurrentAudio();" class="mt-4 px-4 py-1.5 rounded-full bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs sm:text-sm font-bold inline-flex items-center gap-2 transition-all shadow-xs">
                <i class="fa-solid fa-volume-high text-amber-500"></i> 美音發音
              </button>
            </div>

            <div class="text-center text-xs text-slate-400 font-medium">
              <i class="fa-solid fa-hand-pointer mr-1 text-pink-400"></i> 點擊翻轉看釋義與多益例句 (Space)
            </div>
          </div>

          <!-- 卡片背面 (中文釋義與例句) -->
          <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 p-8 flex flex-col justify-between rounded-3xl bg-slate-900 text-white shadow-2xl border border-slate-800">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <div class="flex items-center gap-2">
                <span id="card-word-back" class="font-extrabold text-xl text-pink-300">company</span>
                <span id="card-pos-back" class="text-xs text-slate-400 font-mono">(n.)</span>
              </div>
              <button onclick="event.stopPropagation(); toggleCurrentCardStar();" class="p-2 -mr-2 text-3xl transition-transform active:scale-125 focus:outline-none" title="加入/取消收藏">
                <i id="card-star-icon-back" class="fa-regular fa-star text-slate-600 hover:text-amber-400"></i>
              </button>
            </div>

            <div class="my-auto py-2">
              <div class="text-2xl sm:text-3xl font-black text-amber-300 mb-3" id="card-meaning">公司；陪伴</div>
              <div class="bg-slate-800/90 p-4 rounded-2xl border border-slate-700/60">
                <p id="card-sentence-en" class="text-sm text-slate-200 font-medium leading-relaxed mb-1.5">She works for a tech company in the Bay Area as an engineer.</p>
                <p id="card-sentence-zh" class="text-xs text-slate-400 leading-relaxed font-normal">她在灣區的一家科技公司擔任工程師。</p>
              </div>
            </div>

            <div class="text-center text-xs text-slate-400 font-medium">
              <i class="fa-solid fa-arrow-rotate-left mr-1 text-pink-400"></i> 點擊翻回正面
            </div>
          </div>

        </div>
      </div>

      <!-- 切換按鈕 -->
      <div class="w-full max-w-lg mt-5 flex items-center justify-between gap-3">
        <button onclick="prevCard()" class="flex-1 py-3 px-4 rounded-2xl bg-white border border-rose-200 text-slate-700 font-bold hover:bg-rose-50 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-xs text-sm">
          <i class="fa-solid fa-chevron-left"></i> 上一張
        </button>
        <button onclick="nextCard()" class="flex-1 py-3 px-4 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold hover:from-pink-600 hover:to-rose-600 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-md shadow-pink-200 text-sm">
          下一張 <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </section>

    <!-- ================= 模式 2：四選一小測驗 ================= -->
    <section id="mode-quiz" class="hidden flex-1 flex flex-col items-center justify-center">
      <div class="w-full max-w-lg bg-white p-6 sm:p-7 rounded-3xl shadow-lg border border-rose-100">
        <div class="flex items-center justify-between text-xs text-slate-400 mb-4 pb-2 border-b border-rose-50">
          <span id="quiz-progress" class="font-bold text-slate-600">第 1 題 / 共 10 題</span>
          <span id="quiz-score" class="font-extrabold text-pink-600 bg-pink-50 px-2.5 py-1 rounded-full">得分: 0</span>
        </div>

        <div class="text-center py-3 mb-4">
          <span class="text-[11px] font-black px-2.5 py-0.5 rounded-full bg-pink-100 text-pink-700 uppercase" id="quiz-pos">noun</span>
          <h2 id="quiz-question-word" class="text-3xl sm:text-4xl font-black text-slate-800 mt-2.5 mb-1.5">passenger</h2>
          <button onclick="playQuizAudio()" class="text-amber-600 hover:text-amber-700 text-xs font-bold inline-flex items-center gap-1.5 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
            <i class="fa-solid fa-volume-high"></i> 聆聽單字發音
          </button>
        </div>

        <div id="quiz-options" class="grid grid-cols-1 gap-2.5 mb-4">
          <!-- 4 個選項按鈕動態注入 -->
        </div>

        <div id="quiz-feedback" class="hidden p-3.5 rounded-2xl text-center text-xs sm:text-sm font-semibold mb-4 leading-relaxed"></div>

        <button id="quiz-next-btn" onclick="nextQuizQuestion()" class="hidden w-full py-3 rounded-2xl bg-slate-900 text-white font-bold hover:bg-slate-800 transition-all text-sm shadow-md">
          前往下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
        </button>
      </div>
    </section>

    <!-- ================= 模式 3：單字總覽列表 ================= -->
    <section id="mode-list" class="hidden flex-1">
      <div class="bg-white rounded-3xl shadow-sm border border-rose-100 overflow-hidden">
        <div class="p-4 border-b border-rose-100 flex items-center justify-between bg-pink-50/40">
          <div class="text-xs sm:text-sm font-extrabold text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-book-bookmark text-pink-500"></i>
            單字清單 (<span id="list-count" class="text-pink-600">25</span>)
          </div>
          <div class="text-xs text-slate-400">點擊 ⭐ 即時自動保存</div>
        </div>
        <div id="vocab-table-body" class="divide-y divide-rose-50 max-h-[500px] overflow-y-auto">
          <!-- 動態生成各單字清單項目 -->
        </div>
      </div>
    </section>

  </main>

  <!-- 提示快顯 (Toast) -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/95 backdrop-blur-md text-white text-xs px-5 py-2.5 rounded-full shadow-2xl opacity-0 transition-opacity pointer-events-none z-50 flex items-center gap-2"></div>

  <script>
    // ===== 250 個「衝400分必備單字」完整資料庫 (第1頁至第25頁，每頁10字，共10個Part，完全零重複) =====
    const VOCAB_DATA = [
      // --- PART 1 (頁 1-2.5) 25 字 ---
      { id: 1, word: "company", pos: "n.", meaning: "公司；陪伴", en: "She works for a tech company in the Bay Area as an engineer.", zh: "她在灣區的一家科技公司擔任工程師。" },
      { id: 2, word: "passenger", pos: "n.", meaning: "乘客", en: "All passengers should wear a mask on the train.", zh: "所有乘客在火車上都應佩戴口罩。" },
      { id: 3, word: "subject", pos: "n.", meaning: "主題；科目", en: "The professor discussed various subjects in the lecture.", zh: "教授在演講中討論了好幾個主題。" },
      { id: 4, word: "area", pos: "n.", meaning: "地區；領域", en: "This building is located in a busy commercial area.", zh: "這棟建築位於繁忙的商業區。" },
      { id: 5, word: "cashier", pos: "n.", meaning: "收銀員", en: "The cashier will help you with the return process.", zh: "收銀員會協助您完成退貨流程。" },
      { id: 6, word: "amount", pos: "n.", meaning: "數量；總額", en: "The amount of work I got for the quarter is ridiculous!", zh: "我這個季度的工作量太荒謬了！" },
      { id: 7, word: "clinic", pos: "n.", meaning: "診所", en: "I'm going to the clinic to get a flu shot.", zh: "我要去診所打流感疫苗。" },
      { id: 8, word: "fee", pos: "n.", meaning: "費用；服務費用", en: "There is an admission fee for the museum.", zh: "博物館有入場費。" },
      { id: 9, word: "appointment", pos: "n.", meaning: "預約；任命、委派", en: "I'll miss the meeting due to a doctor's appointment.", zh: "因為預約要看醫生，這次開會我會缺席。" },
      { id: 10, word: "reservation", pos: "n.", meaning: "預訂；保護區", en: "I'd like to make a reservation for eight people at 6 tonight.", zh: "我想預訂今晚六點八人的位子。" },
      { id: 11, word: "employee", pos: "n.", meaning: "員工；受雇者", en: "The employee received a promotion for his hard work.", zh: "這位員工因工作努力而獲得了晉升。" },
      { id: 12, word: "task", pos: "n.", meaning: "任務；工作", en: "He has been assigned a challenging task.", zh: "他被分配了一項有挑戰性的任務。" },
      { id: 13, word: "label", pos: "n.", meaning: "標籤；品牌", en: "The label on the package indicates the contents.", zh: "包裝上的標籤標明了內容物。" },
      { id: 14, word: "lobby", pos: "n.", meaning: "大廳；門廊", en: "I met him in the hotel lobby last Monday.", zh: "我上星期一在飯店大廳遇見了他。" },
      { id: 15, word: "option", pos: "n.", meaning: "選項；選擇", en: "Students at the school have the option of studying abroad.", zh: "這所學校的學生有出國留學的選項。" },
      { id: 16, word: "receipt", pos: "n.", meaning: "收據；收到", en: "Don't forget to keep the receipt for your purchase.", zh: "別忘記保留購物收據。" },
      { id: 17, word: "printer", pos: "n.", meaning: "印表機", en: "The office printer needs more paper and toner.", zh: "辦公室的印表機需要更多紙張和碳粉。" },
      { id: 18, word: "pharmacy", pos: "n.", meaning: "藥房；藥局", en: "You can pick up your medicines at the pharmacy next door.", zh: "您可以在隔壁的藥房取藥。" },
      { id: 19, word: "destination", pos: "n.", meaning: "目的地；終點", en: "Paris is a popular tourist destination in Europe.", zh: "巴黎是歐洲著名的旅遊勝地。" },
      { id: 20, word: "goal", pos: "n.", meaning: "目標", en: "His goal was to get into Harvard University.", zh: "他的目標是進入哈佛大學。" },
      { id: 21, word: "author", pos: "n.", meaning: "作者", en: "He is the author of several best-selling novels.", zh: "他是寫了幾本暢銷小說的作者。" },
      { id: 22, word: "description", pos: "n.", meaning: "描述；說明", en: "The catalog gives a full description of each product.", zh: "目錄中對每件產品都有完整的描述。" },
      { id: 23, word: "reminder", pos: "n.", meaning: "提醒；提示", en: "This is a friendly reminder that smoking is prohibited.", zh: "友善提醒一下這裡禁菸。" },

      { id: 25, word: "flight", pos: "n.", meaning: "班機；航程", en: "I booked a flight to London for next week.", zh: "我訂了下週飛往倫敦的機票。" },

      // --- PART 2 (頁 3-5) 25 字 ---
      { id: 26, word: "brand", pos: "n.", meaning: "品牌", en: "The advertisement effectively promoted the brand.", zh: "那支廣告替該品牌做了有效的宣傳。" },
      { id: 27, word: "vehicle", pos: "n.", meaning: "車輛；交通工具", en: "The road is closed to all vehicles. We'll need to walk.", zh: "道路對所有車輛關閉。我們需要步行前往。" },
      { id: 28, word: "site", pos: "n.", meaning: "地點；場所", en: "The construction site is located downtown.", zh: "施工地點位於市中心。" },
      { id: 29, word: "occupation", pos: "n.", meaning: "職業", en: "Teaching is a rewarding occupation.", zh: "教學是一項令人滿足的職業。" },
      { id: 30, word: "payment", pos: "n.", meaning: "支付；支付款項", en: "Please make the payment before the due date.", zh: "請在截止日期前付款。" },
      { id: 31, word: "account", pos: "n.", meaning: "帳戶；描述；客戶", en: "You'll need to bring your passport to open a new account.", zh: "您需要帶護照來開立新帳戶。" },
      { id: 32, word: "region", pos: "n.", meaning: "區域；地區", en: "The company operates in several regions around the world.", zh: "該公司在全球多個地區營運。" },
      { id: 33, word: "receptionist", pos: "n.", meaning: "接待人員", en: "The receptionist greeted visitors at the main entrance.", zh: "接待員在公司大門口迎接訪客。" },
      { id: 34, word: "volume", pos: "n.", meaning: "音量；量；(書)冊", en: "I can't hear the music. Can you turn up the volume?", zh: "我聽不到音樂。你可以把音量調大聲一點嗎？" },
      { id: 35, word: "item", pos: "n.", meaning: "項目；品項", en: "Let's move on to the last item on the agenda.", zh: "我們接著來討論議程上的最後一個項目吧。" },

    // ===== 萬無一失的持久化引擎：IndexedDB + URL Hash + LocalStorage =====
    const DB_NAME = 'ToeicVocabAppDB';
    const DB_STORE = 'app_state';
    let idb = null;

    // 初始化 IndexedDB
    function initIndexedDB() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(DB_STORE)) {
              db.createObjectStore(DB_STORE);
            }
          };
          req.onsuccess = (e) => {
            idb = e.target.result;
            resolve(idb);
          };
          req.onerror = () => resolve(null);
        } catch (err) {
          resolve(null);
        }
      });
    }

    // 從 IndexedDB 讀取
    function readFromIDB(key) {
      return new Promise((resolve) => {
        if (!idb) return resolve(null);
        try {
          const tx = idb.transaction(DB_STORE, 'readonly');
          const store = tx.objectStore(DB_STORE);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch(e) {
          resolve(null);
        }
      });
    }

    // 寫入 IndexedDB
    function writeToIDB(key, val) {
      if (!idb) return;
      try {
        const tx = idb.transaction(DB_STORE, 'readwrite');
        const store = tx.objectStore(DB_STORE);
        store.put(val, key);
      } catch(e) {}
    }

    // 讀取 URL Hash 中的 stars 參數 (如 #stars=1,4,15,99)
    function readStarsFromURLHash() {
      try {
        const hash = window.location.hash;
        if (hash && hash.includes('stars=')) {
          const match = hash.match(/stars=([^&]+)/);
          if (match && match[1]) {
            const ids = match[1].split(',')
              .map(n => parseInt(n.trim(), 10))
              .filter(n => !isNaN(n) && n >= 1 && n <= 250);
            if (ids.length > 0) return ids;
          }
        }
      } catch(e) {}
      return null;
    }

    // 將收藏即時同步到 URL Hash
    function syncStarsToURLHash() {
      try {
        const arr = Array.from(starredSet).sort((a,b) => a - b);
        if (arr.length > 0) {
          const newHash = `stars=${arr.join(',')}`;
          history.replaceState(null, '', `#${newHash}`);
        } else {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      } catch(e) {}
    }

    // 整合式全自動載入（優先順序：URL Hash > IndexedDB > LocalStorage > Cookie）
    async function loadAllSavedData() {
      let restoredIds = null;

      // 1. 檢查 URL Hash（最強韌：重整、書籤必定保留）
      const urlIds = readStarsFromURLHash();
      if (urlIds && urlIds.length > 0) {
        restoredIds = urlIds;
      }

      // 2. 檢查 IndexedDB
      if (!restoredIds) {
        const idbData = await readFromIDB('starred_ids');
        if (Array.isArray(idbData) && idbData.length > 0) {
          restoredIds = idbData;
        }
      }

      // 3. 檢查 LocalStorage
      if (!restoredIds) {
        try {
          const lsData = localStorage.getItem('toeic400_starred');
          if (lsData) {
            const parsed = JSON.parse(lsData);
            if (Array.isArray(parsed) && parsed.length > 0) restoredIds = parsed;
          }
        } catch(e) {}
      }

      // 4. 檢查 Cookie
      if (!restoredIds) {
        try {
          const cookieVal = getCookie('toeic400_starred');
          if (cookieVal) {
            const parsed = JSON.parse(cookieVal);
            if (Array.isArray(parsed) && parsed.length > 0) restoredIds = parsed;
          }
        } catch(e) {}
      }

      if (restoredIds) {
        starredSet = new Set(restoredIds);
      } else {
        starredSet = new Set(DEFAULT_STARS);
      }

      // 自動將當前狀態同步回所有層次
      saveStarsAutomatically(false);
      updateStarredBadge();
    }

    // 全自動背景儲存 (LocalStorage + IndexedDB + URL Hash + Cookie)
    function saveStarsAutomatically(showFeedback = true) {
      const arr = Array.from(starredSet);
      const jsonStr = JSON.stringify(arr);

      // 1. LocalStorage
      try { localStorage.setItem('toeic400_starred', jsonStr); } catch(e) {}

      // 2. IndexedDB
      writeToIDB('starred_ids', arr);

      // 3. URL Hash (即時更新網址，讓刷新與書籤永遠不會掉資料)
      syncStarsToURLHash();

      // 4. Cookie (備援)
      try { setCookie('toeic400_starred', jsonStr, 365); } catch(e) {}

      updateStarredBadge();

      // 更新徽章動態回饋
      const badge = document.getElementById('sync-status-badge');
      if (badge && showFeedback) {
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span>已即時自動存檔</span>`;
      }
    }

    // Cookie 輔助工具
    function setCookie(cname, cvalue, exdays) {
      const d = new Date();
      d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
      document.cookie = cname + "=" + encodeURIComponent(cvalue) + ";expires=" + d.toUTCString() + ";path=/;SameSite=Lax";
    }

    function getCookie(cname) {
      const name = cname + "=";
      const decodedCookie = decodeURIComponent(document.cookie);
      const ca = decodedCookie.split(';');
      for(let i = 0; i < ca.length; i++) {
        let c = ca[i].trim();
        if (c.indexOf(name) === 0) return c.substring(name.length, c.length);
      }
      return "";
    }

    // ===== 一鍵下載進度檔 (.json) 與匯入 =====
    function exportDataBackup() {
      const backupData = {
        title: "TOEIC 400 Vocab Progress",
        exportDate: new Date().toISOString(),
        starredIds: Array.from(starredSet)
      };
      const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `toeic400_stars_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("💾 已自動下載進度檔案！");
    }

    function importDataBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          let ids = [];
          if (Array.isArray(parsed)) ids = parsed;
          else if (parsed && Array.isArray(parsed.starredIds)) ids = parsed.starredIds;

          if (ids.length >= 0) {
            starredSet = new Set(ids);
            saveStarsAutomatically(true);
            updateCardUI();
            renderListUI();
            showToast(`🎉 成功匯入 ${ids.length} 個單字收藏！`);
          }
        } catch(err) {
          showToast("⚠️ 檔案格式不符合！");
        }
      };
      reader.readAsText(file);
      e.target.value = ''; // 重置 input
    }

    // ===== 初始化程式 =====
    window.onload = async function() {
      await initIndexedDB();
      await loadAllSavedData();
      renderPartButtons();
      loadPart(1);
    };

    function updateStarredBadge() {
      const badge = document.getElementById('starred-badge');
      if (badge) badge.innerText = starredSet.size;
    }

    // 生成 Part 1 ~ Part 10 按鈕
    function renderPartButtons() {
      const container = document.getElementById('part-buttons');
      container.innerHTML = '';
      for (let p = 1; p <= 10; p++) {
        const startNum = (p - 1) * 25 + 1;
        const endNum = p * 25;
        const btn = document.createElement('button');
        btn.id = `part-btn-${p}`;
        btn.className = `part-btn text-xs px-3 py-1.5 rounded-xl font-bold border transition-all ${
          p === currentPart && !isStarredOnlyMode
            ? 'bg-gradient-to-r from-pink-500 to-rose-400 text-white border-pink-400 shadow-sm'
            : 'bg-white text-slate-700 border-rose-100 hover:bg-pink-50'
        }`;
        btn.innerHTML = `Part ${p} <span class="opacity-60 text-[10px]">(${startNum}-${endNum})</span>`;
        btn.onclick = () => {
          isStarredOnlyMode = false;
          loadPart(p);
        };
        container.appendChild(btn);
      }
    }

    // 載入指定 Part
    function loadPart(partNum) {
      currentPart = partNum;
      isStarredOnlyMode = false;

      document.querySelectorAll('.part-btn').forEach(b => {
        b.className = 'part-btn text-xs px-3 py-1.5 rounded-xl font-bold border transition-all bg-white text-slate-700 border-rose-100 hover:bg-pink-50';
      });
      const activeBtn = document.getElementById(`part-btn-${partNum}`);
      if (activeBtn) {
        activeBtn.className = 'part-btn text-xs px-3 py-1.5 rounded-xl font-bold border transition-all bg-gradient-to-r from-pink-500 to-rose-400 text-white border-pink-400 shadow-sm';
      }

      const starBtn = document.getElementById('btn-star-filter');
      starBtn.classList.remove('ring-2', 'ring-amber-400');

      document.getElementById('current-part-label').innerText = `Part ${partNum} (第 ${(partNum-1)*25+1} - ${partNum*25} 字)`;

      const startIndex = (partNum - 1) * 25;
      currentList = VOCAB_DATA.slice(startIndex, startIndex + 25);
      currentIndex = 0;
      isFlipped = false;

      updateCardUI();
      renderListUI();
      resetQuiz();
    }

    // 切換星號收藏清單模式
    function toggleStarredView() {
      if (starredSet.size === 0) {
        showToast("目前尚未收藏任何單字！請先點擊 ⭐ 進行收藏");
        return;
      }

      isStarredOnlyMode = !isStarredOnlyMode;
      const starBtn = document.getElementById('btn-star-filter');

      if (isStarredOnlyMode) {
        currentList = VOCAB_DATA.filter(item => starredSet.has(item.id));
        document.getElementById('current-part-label').innerText = `⭐ 我的星號錯題 (${currentList.length} 字)`;
        starBtn.classList.add('ring-2', 'ring-amber-400');
        document.querySelectorAll('.part-btn').forEach(b => {
          b.className = 'part-btn text-xs px-3 py-1.5 rounded-xl font-bold border transition-all bg-white text-slate-700 border-rose-100 hover:bg-pink-50';
        });
      } else {
        loadPart(currentPart);
        return;
      }

      currentIndex = 0;
      isFlipped = false;
      updateCardUI();
      renderListUI();
      resetQuiz();
    }

    // ===== 翻轉卡片邏輯 =====
    function flipCard() {
      const inner = document.getElementById('flashcard-inner');
      isFlipped = !isFlipped;
      if (isFlipped) {
        inner.classList.add('rotate-y-180');
      } else {
        inner.classList.remove('rotate-y-180');
      }
    }

    function updateCardUI() {
      if (!currentList || currentList.length === 0) return;

      const item = currentList[currentIndex];
      const isStarred = starredSet.has(item.id);

      // 正面更新
      document.getElementById('card-counter').innerText = `${currentIndex + 1} / ${currentList.length}`;
      document.getElementById('card-pos-front').innerText = item.pos;
      document.getElementById('card-word').innerText = item.word;

      // 背面更新
      document.getElementById('card-word-back').innerText = item.word;
      document.getElementById('card-pos-back').innerText = `(${item.pos})`;
      document.getElementById('card-meaning').innerText = item.meaning;
      document.getElementById('card-sentence-en').innerText = item.en;
      document.getElementById('card-sentence-zh').innerText = item.zh;

      // 星號圖示更新
      const frontStar = document.getElementById('card-star-icon');
      const backStar = document.getElementById('card-star-icon-back');
      if (isStarred) {
        frontStar.className = "fa-solid fa-star text-amber-400 drop-shadow-xs";
        backStar.className = "fa-solid fa-star text-amber-400 drop-shadow-xs";
      } else {
        frontStar.className = "fa-regular fa-star text-slate-300 hover:text-amber-400";
        backStar.className = "fa-regular fa-star text-slate-600 hover:text-amber-400";
      }

      // 重設正反面視角
      const inner = document.getElementById('flashcard-inner');
      if (isFlipped) {
        isFlipped = false;
        inner.classList.remove('rotate-y-180');
      }

      if (autoAudio) {
        playCurrentAudio();
      }
    }

    function nextCard() {
      if (currentIndex < currentList.length - 1) {
        currentIndex++;
        updateCardUI();
      } else {
        showToast("🎉 已完成本單元所有卡片！");
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCardUI();
      }
    }

    function shuffleCurrentList() {
      for (let i = currentList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
      }
      currentIndex = 0;
      updateCardUI();
      renderListUI();
      showToast("🔀 已打亂單字順序！");
    }

    // 收藏點擊切換 (附帶即時自動持久化)
    function toggleCurrentCardStar() {
      const item = currentList[currentIndex];
      if (!item) return;

      if (starredSet.has(item.id)) {
        starredSet.delete(item.id);
        showToast(`已移除收藏: ${item.word}`);
      } else {
        starredSet.add(item.id);
        showToast(`⭐ 已自動保存收藏: ${item.word}`);
      }

      // 觸發全自動持久化
      saveStarsAutomatically(true);

      updateCardUI();
      renderListUI();

      if (isStarredOnlyMode && starredSet.size === 0) {
        showToast("收藏清單已無單字，返回一般單元");
        toggleStarredView();
      }
    }

    // 朗讀單字
    function playCurrentAudio() {
      const item = currentList[currentIndex];
      if (!item) return;
      speakWord(item.word);
    }

    function speakWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function toggleAudioAuto() {
      autoAudio = !autoAudio;
      document.getElementById('auto-audio-status').innerText = autoAudio ? "開" : "關";
      showToast(`自動發音已${autoAudio ? "開啟" : "關閉"}`);
    }

    // ===== 模式切換 =====
    function setMode(mode) {
      document.getElementById('mode-flashcard').classList.add('hidden');
      document.getElementById('mode-quiz').classList.add('hidden');
      document.getElementById('mode-list').classList.add('hidden');

      ['tab-flashcard', 'tab-quiz', 'tab-list'].forEach(id => {
        const btn = document.getElementById(id);
        btn.className = "tab-btn px-4 py-2 font-bold text-xs sm:text-sm rounded-2xl transition-all bg-white text-slate-600 hover:bg-rose-50 border border-slate-200/80";
      });

      const activeTab = document.getElementById(`tab-${mode}`);
      activeTab.className = "tab-btn px-4 py-2 font-bold text-xs sm:text-sm rounded-2xl transition-all bg-gradient-to-r from-pink-500 to-rose-400 text-white shadow-md shadow-pink-200";

      if (mode === 'flashcard') {
        document.getElementById('mode-flashcard').classList.remove('hidden');
      } else if (mode === 'quiz') {
        document.getElementById('mode-quiz').classList.remove('hidden');
        initQuiz();
      } else if (mode === 'list') {
        document.getElementById('mode-list').classList.remove('hidden');
      }
    }

    // ===== 模式 3：單字總覽列表 UI =====
    function renderListUI() {
      const tbody = document.getElementById('vocab-table-body');
      tbody.innerHTML = '';
      document.getElementById('list-count').innerText = currentList.length;

      currentList.forEach((item, idx) => {
        const isStarred = starredSet.has(item.id);
        const row = document.createElement('div');
        row.className = "p-3.5 flex items-center justify-between hover:bg-pink-50/40 transition-colors";
        row.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="text-xs text-slate-300 w-5 font-mono">${idx + 1}</span>
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-800 text-sm">${item.word}</span>
                <span class="text-xs text-slate-400 font-mono">${item.pos}</span>
                <button onclick="speakWord('${item.word}')" class="text-xs text-pink-500 hover:text-pink-700">
                  <i class="fa-solid fa-volume-high"></i>
                </button>
              </div>
              <div class="text-xs text-slate-500 mt-0.5">${item.meaning}</div>
            </div>
          </div>
          <button onclick="toggleRowStar(${item.id})" class="p-2 text-xl focus:outline-none transition-transform active:scale-125">
            <i class="${isStarred ? 'fa-solid fa-star text-amber-400' : 'fa-regular fa-star text-slate-300 hover:text-amber-400'}"></i>
          </button>
        `;
        tbody.appendChild(row);
      });
    }

    function toggleRowStar(id) {
      if (starredSet.has(id)) {
        starredSet.delete(id);
      } else {
        starredSet.add(id);
      }
      saveStarsAutomatically(true);
      updateCardUI();
      renderListUI();
    }

    // ===== 模式 2：四選一測驗邏輯 =====
    function resetQuiz() {
      quizIndex = 0;
      quizScore = 0;
      document.getElementById('quiz-score').innerText = `得分: 0`;
    }

    function initQuiz() {
      resetQuiz();
      quizList = [...currentList];
      for (let i = quizList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [quizList[i], quizList[j]] = [quizList[j], quizList[i]];
      }
      loadQuizQuestion();
    }

    function loadQuizQuestion() {
      const feedback = document.getElementById('quiz-feedback');
      const nextBtn = document.getElementById('quiz-next-btn');
      feedback.className = "hidden p-3.5 rounded-2xl text-center text-xs sm:text-sm font-semibold mb-4 leading-relaxed";
      feedback.innerText = "";
      nextBtn.classList.add('hidden');

      if (quizIndex >= quizList.length) {
        document.getElementById('quiz-question-word').innerText = "測驗全部完成！🎉";
        document.getElementById('quiz-pos').innerText = "COMPLETE";
        document.getElementById('quiz-options').innerHTML = `
          <div class="text-center py-6">
            <div class="text-5xl font-black text-pink-500 mb-2">${quizScore} / ${quizList.length}</div>
            <p class="text-xs sm:text-sm text-slate-500 mb-4">做得好！弱點與錯題都已可隨時在「星號錯題」中重溫！</p>
            <button onclick="initQuiz()" class="px-6 py-2.5 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold text-xs sm:text-sm shadow-md">再次挑戰本單元</button>
          </div>
        `;
        return;
      }

      const qItem = quizList[quizIndex];
      document.getElementById('quiz-progress').innerText = `第 ${quizIndex + 1} 題 / 共 ${quizList.length} 題`;
      document.getElementById('quiz-pos').innerText = qItem.pos;
      document.getElementById('quiz-question-word').innerText = qItem.word;

      // 1 正確 + 3 干擾項
      const options = [qItem.meaning];
      const otherVocabs = VOCAB_DATA.filter(v => v.id !== qItem.id);
      
      while (options.length < 4 && otherVocabs.length > 0) {
        const randIdx = Math.floor(Math.random() * otherVocabs.length);
        const randMeaning = otherVocabs[randIdx].meaning;
        if (!options.includes(randMeaning)) {
          options.push(randMeaning);
        }
        otherVocabs.splice(randIdx, 1);
      }

      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }

      const optionsContainer = document.getElementById('quiz-options');
      optionsContainer.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "quiz-opt-btn w-full text-left p-3.5 rounded-2xl border border-rose-100 text-slate-700 font-medium hover:bg-pink-50 hover:border-pink-300 transition-all text-xs sm:text-sm bg-white shadow-xs";
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(opt, qItem, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedOpt, currentItem, btnElement) {
      const allBtns = document.querySelectorAll('.quiz-opt-btn');
      allBtns.forEach(b => b.disabled = true);

      const feedback = document.getElementById('quiz-feedback');
      const nextBtn = document.getElementById('quiz-next-btn');

      if (selectedOpt === currentItem.meaning) {
        btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
        feedback.className = "p-3.5 rounded-2xl text-center text-xs sm:text-sm font-semibold mb-4 bg-emerald-50 text-emerald-800 border border-emerald-200";
        feedback.innerHTML = `答對了！✨ <br><span class="text-xs text-emerald-600 font-normal">${currentItem.en}</span>`;
        quizScore++;
        document.getElementById('quiz-score').innerText = `得分: ${quizScore}`;
      } else {
        btnElement.classList.add('bg-rose-500', 'text-white', 'border-rose-500');
        allBtns.forEach(b => {
          if (b.innerText === currentItem.meaning) {
            b.classList.add('bg-emerald-100', 'text-emerald-800', 'border-emerald-400');
          }
        });

        // 自動將答錯的單字加入收藏保存
        const alreadyStarred = starredSet.has(currentItem.id);
        if (!alreadyStarred) {
          starredSet.add(currentItem.id);
          saveStarsAutomatically(true);
        }

        feedback.className = "p-3.5 rounded-2xl text-center text-xs sm:text-sm font-semibold mb-4 bg-rose-50 text-rose-800 border border-rose-200";
        feedback.innerHTML = `答錯了！正確意思為：<strong>${currentItem.meaning}</strong>
          <div class="mt-2 text-xs text-rose-600 font-normal">已自動為您加星 ⭐ 收藏至複習庫中！</div>`;
      }

      feedback.classList.remove('hidden');
      nextBtn.classList.remove('hidden');
    }

    function nextQuizQuestion() {
      quizIndex++;
      loadQuizQuestion();
    }

    function playQuizAudio() {
      const qItem = quizList[quizIndex];
      if (qItem) speakWord(qItem.word);
    }

    // 鍵盤左右方向鍵切換、空白鍵翻轉
    window.addEventListener('keydown', (e) => {
      const isCardMode = !document.getElementById('mode-flashcard').classList.contains('hidden');
      if (!isCardMode) return;

      if (e.key === 'ArrowRight') {
        nextCard();
      } else if (e.key === 'ArrowLeft') {
        prevCard();
      } else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        flipCard();
      }
    });

    // 浮動提示 Toast
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> ${msg}`;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2200);
    }
  </script>
